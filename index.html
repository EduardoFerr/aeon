    <script>
      /* Tema antes da primeira pintura (sem flash do tema errado). Ordem: escolha salva > prefers-color-scheme
         (escuro = Crepusculo, claro = Aurora). Funciona sem localStorage. So as fontes do tema ativo sao pedidas. */
      (function () {
        var d = document.documentElement;
        var TH = {
          crepusculo: { scheme: "dark", color: "#14101c",
            fonts: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap",
            faces: ['500 1em "Cormorant Garamond"', 'italic 500 1em "Cormorant Garamond"', '400 1em "Inter"', '600 1em "Inter"'] },
          aurora: { scheme: "light", color: "#f1f3ec",
            fonts: "https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,48,300..600;1,48,300..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap",
            faces: ['350 1em "Fraunces"', 'italic 400 1em "Fraunces"', '400 1em "Hanken Grotesk"', '600 1em "Hanken Grotesk"'] }
        };
        window.AEON_THEMES = TH;
        var t = null;
        try { var s = localStorage.getItem("aeon.tema"); if (TH[s]) t = s; } catch (e) {}
        if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "aurora" : "crepusculo";
        d.setAttribute("data-theme", t);
        d.style.colorScheme = TH[t].scheme;
        var m = document.createElement("meta"); m.name = "theme-color"; m.content = TH[t].color; document.head.appendChild(m);
        var l = document.createElement("link"); l.rel = "stylesheet"; l.href = TH[t].fonts; l.id = "font-" + t; document.head.appendChild(l);
      })();
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const botao = document.getElementById("scrollToTop");
        const rodape = document.querySelector("footer");
        const reduz = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

        // Aparece so com rolagem relevante: passou de 300 px e a pagina tem mais de 1,5 tela de altura.
        // Quando o rodape entra na janela, o botao sobe para ficar acima dele e nao cobre o texto.
        function atualizar() {
          const rolavel = document.documentElement.scrollHeight > innerHeight * 1.5;
          const mostrar = rolavel && window.scrollY > 300;
          botao.style.display = mostrar ? "flex" : "none";
          if (!mostrar) return;
          const topoRodape = rodape ? rodape.getBoundingClientRect().top : innerHeight;
          const lift = Math.max(0, innerHeight - topoRodape) + 16;
          botao.style.setProperty("--lift", topoRodape < innerHeight ? lift + "px" : "0px");
        }
        window.addEventListener("scroll", atualizar, { passive: true });
        window.addEventListener("resize", atualizar);
        new ResizeObserver(atualizar).observe(document.body);

        botao.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: reduz() ? "auto" : "smooth" });
        });
      });
    </script>
